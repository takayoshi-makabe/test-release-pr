name: Create Release Pull Request

on:
  push:
    # staging への push (revert など) でも本文を更新する
    branches: [develop, staging]
  workflow_dispatch:

concurrency:
  group: create-release-pull-request
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # label 作成用

jobs:
  release-pull-request:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCTION_BRANCH: main
      DEVELOP_BRANCH: develop
      STAGING_BRANCH: staging
      RELEASE_LABEL: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create staging branch if needed
        id: staging
        run: |
          # 既に staging があれば develop を取り込む。staging 上の revert は merge 後も維持される
          if git rev-parse --verify -q "origin/${STAGING_BRANCH}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q -B "$STAGING_BRANCH" "origin/${STAGING_BRANCH}"
            if git merge --no-edit "origin/${DEVELOP_BRANCH}"; then
              git push origin "HEAD:refs/heads/${STAGING_BRANCH}"
            else
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

          if git diff --quiet "origin/${PRODUCTION_BRANCH}" "origin/${DEVELOP_BRANCH}"; then
            echo "No diff between ${PRODUCTION_BRANCH} and ${DEVELOP_BRANCH}. Skip."
            exit 0
          fi
          if ! git merge-base --is-ancestor "origin/${PRODUCTION_BRANCH}" "origin/${DEVELOP_BRANCH}"; then
            echo "::warning::${PRODUCTION_BRANCH} is not merged back into ${DEVELOP_BRANCH}. Skip creating ${STAGING_BRANCH}."
            exit 0
          fi

          git push origin "refs/remotes/origin/${DEVELOP_BRANCH}:refs/heads/${STAGING_BRANCH}"
          git fetch origin "${STAGING_BRANCH}:refs/remotes/origin/${STAGING_BRANCH}"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Create or update release pull request
        if: steps.staging.outputs.exists == 'true'
        run: |
          gh label create "$RELEASE_LABEL" 2>/dev/null || true

          number=$(gh pr list --base "$PRODUCTION_BRANCH" --head "$STAGING_BRANCH" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            OLD_BODY=$(gh pr view "$number" --json body --jq '.body')
            export OLD_BODY
            body=$(.github/scripts/release-prs.sh body "origin/${STAGING_BRANCH}")
            gh pr edit "$number" --body "$body"
          else
            body=$(.github/scripts/release-prs.sh body "origin/${STAGING_BRANCH}")
            gh pr create --base "$PRODUCTION_BRANCH" --head "$STAGING_BRANCH" \
              --title "Release $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" \
              --body "$body" --label "$RELEASE_LABEL"
          fi

      - name: Fail if develop could not be merged into staging
        if: steps.staging.outputs.conflict == 'true'
        run: |
          echo "::error::${DEVELOP_BRANCH} を ${STAGING_BRANCH} に自動 merge できませんでした (conflict)。手動で merge して push してください。"
          exit 1
